# A three-node RaftKV cluster plus Prometheus.
#
#   docker compose up --build -d
#   go run ./cmd/raftkv put -servers localhost:7001,localhost:7002,localhost:7003 color blue
#   go run ./cmd/raftkv status -servers localhost:7001,localhost:7002,localhost:7003
#   docker compose stop node1        # kill a node; the cluster keeps serving
#
# Prometheus is at http://localhost:9090.

x-node: &node
  build: .
  image: raftkv
  restart: unless-stopped

services:
  node1:
    <<: *node
    command: serve -id 1 -peers 1=node1:7000,2=node2:7000,3=node3:7000 -listen :7000 -data /data
    ports: ["7001:7000"]
    volumes: ["node1:/data"]
  node2:
    <<: *node
    command: serve -id 2 -peers 1=node1:7000,2=node2:7000,3=node3:7000 -listen :7000 -data /data
    ports: ["7002:7000"]
    volumes: ["node2:/data"]
  node3:
    <<: *node
    command: serve -id 3 -peers 1=node1:7000,2=node2:7000,3=node3:7000 -listen :7000 -data /data
    ports: ["7003:7000"]
    volumes: ["node3:/data"]
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

volumes:
  node1:
  node2:
  node3:
