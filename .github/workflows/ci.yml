name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: Tests with the race detector
        run: go test -race -count=1 -timeout 20m ./...

      - name: Chaos sweep, 3 nodes
        run: go run ./cmd/raftsim -seeds 500 -nodes 3

      - name: Chaos sweep, 5 nodes
        run: go run ./cmd/raftsim -seeds 500 -nodes 5

      - name: Fuzz the parsers
        run: |
          go test ./kv -run '^$' -fuzz '^FuzzDecode$' -fuzztime 30s
          go test ./kv -run '^$' -fuzz '^FuzzRestore$' -fuzztime 30s
          go test ./storage -run '^$' -fuzz '^FuzzOpen$' -fuzztime 30s

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t raftkv .
